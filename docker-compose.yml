services:
  db:
    image: postgres:15-alpine
    container_name: cialco-db-dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cialco
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./init-scripts/1-schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./init-scripts/2-data.sql:/docker-entrypoint-initdb.d/2-data.sql
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: cialco-backend-dev
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=cialco
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - db
    ports:
      - "3000:3000"

volumes:
  postgres_data_dev:
